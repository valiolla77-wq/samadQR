name: Build & Publish Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.3.0)'
        required: false
        default: ''
      release_name:
        description: 'Release Title'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
          elif [ -f "$GITHUB_WORKSPACE/my-upload-key.jks" ]; then
            echo "Using existing repository keystore (my-upload-key.jks)..."
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
          else
            echo "Generating new keystore (my-upload-key.jks)..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SamadFoodQR, OU=Mobile, O=Samad, L=Tehran, ST=Tehran, C=IR"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Android APK
        run: |
          ./gradlew assembleRelease --no-daemon -Dkotlin.compiler.execution.strategy=daemon || ./gradlew assembleDebug --no-daemon

      - name: Locate and Prepare Release APK
        id: apk_locator
        run: |
          # 1. Determine Version from input, git tag, or app/build.gradle.kts
          GRADLE_VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$GRADLE_VERSION" ]; then
            GRADLE_VERSION="1.3.0"
          fi

          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="v${GRADLE_VERSION}"
            fi
          fi

          # Ensure tag starts with 'v'
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v${TAG}"
          fi

          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi

          OUTPUT_NAME="SamadFoodQR-${TAG}.apk"
          cp "$APK_PATH" "$OUTPUT_NAME"
          echo "apk_path=$OUTPUT_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "gradle_version=$GRADLE_VERSION" >> $GITHUB_OUTPUT
          echo "Found APK at $APK_PATH -> Prepared as $OUTPUT_NAME with tag $TAG"

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_locator.outputs.tag_name }}
          name: ${{ github.event.inputs.release_name || format('انتشار نسخه جدید سامانه سماد ({0})', steps.apk_locator.outputs.tag_name) }}
          body: |
            ## 📱 انتشار نسخه جدید سامانه سماد (${{ steps.apk_locator.outputs.tag_name }})
            
            ### ✨ تغییرات این نسخه:
            - 🔄 **نسخه‌بندی خودکار با Push:** انتشار خودکار APK و نسخه جدید همگام با push کردن تغییرات به مخزن گیت‌هاب.
            - 📲 **اشتراک‌گذاری هوشمند در پیام‌رسان‌ها:** ارسال کد فراموشی برای وعده خاص، کل روز یا هفته انتخابی جهت تولید و اسکن مستقیم بارکد در مقصد.
            - 📥 **دریافت و تبدیل سریع بارکد در مقصد:** قابلیت استخراج خودکار کد فراموشی از متن پیام‌های ارسالی دوستان و تولید فوری بارکد سلف.
            - 🏢 **انتخاب سلف دانشجو (سلف من):** قابلیت انتخاب سلف پیش‌فرض و نمایش هشدار هوشمند در صورت رزرو در سلف مغایر.
            - 🚀 **سیستم بروزرسانی درون‌برنامه‌ای:** دانلود و نصب مستقیم نسخه‌های جدید از مخزن گیت‌هاب.
            - 🔒 **حفاظت از بارکدها و کش آفلاین:** حفظ امنیت بارکدها برای دسترسی بدون اینترنت در سلف دانشگاه.
            
            ### 📥 دانلود و نصب:
            فایل `${{ steps.apk_locator.outputs.apk_path }}` پیوست شده را دانلود و نصب نمایید.
          files: ${{ steps.apk_locator.outputs.apk_path }}
          draft: false
          prerelease: false
