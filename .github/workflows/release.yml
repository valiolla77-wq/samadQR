name: Android CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.4.2)'
        required: false
        default: ''
      release_name:
        description: 'Release Title'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build-only validation job for all pushes and PRs (does not publish anything)
  build-and-test:
    name: Build & Test Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore for local validation..."
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

  # Release job: ONLY triggers on git tags matching v* or manual workflow_dispatch
  publish-release:
    name: Build & Publish Release APK
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'android' }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> "$GITHUB_ENV"
          elif [ -f "$GITHUB_WORKSPACE/my-upload-key.jks" ]; then
            echo "Using existing repository keystore (my-upload-key.jks)..."
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'android' }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> "$GITHUB_ENV"
          else
            echo "Generating signing keystore (my-upload-key.jks)..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SamadFoodQR, OU=Mobile, O=Samad, L=Tehran, ST=Tehran, C=IR"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build Android Release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APKs and Generate SHA-256 Checksums
        id: prepare_assets
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          GRADLE_VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$GRADLE_VERSION" ]; then
            GRADLE_VERSION="1.4.5"
          fi

          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            if [[ "$REF" == refs/tags/* ]]; then
              TAG="$REF_NAME"
            else
              TAG="v${GRADLE_VERSION}"
            fi
          fi

          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v${TAG}"
          fi

          mkdir -p release_assets
          APK_COUNT=0

          for apk in $(find app/build/outputs/apk -name "*.apk" | grep -i "release"); do
            apk_filename=$(basename "$apk")
            if [[ "$apk_filename" == *"arm64-v8a"* ]]; then
              dest_name="SamadFoodQR-${TAG}-arm64-v8a.apk"
            elif [[ "$apk_filename" == *"armeabi-v7a"* ]]; then
              dest_name="SamadFoodQR-${TAG}-armeabi-v7a.apk"
            elif [[ "$apk_filename" == *"universal"* ]]; then
              dest_name="SamadFoodQR-${TAG}-universal.apk"
            else
              dest_name="SamadFoodQR-${TAG}-${apk_filename}"
            fi
            cp "$apk" "release_assets/$dest_name"
            APK_COUNT=$((APK_COUNT + 1))
          done

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No release APK files generated!"
            exit 1
          fi

          cd release_assets
          sha256sum *.apk > SHA256SUMS.txt
          CHECKSUM_CONTENT=$(cat SHA256SUMS.txt)
          cd ..

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "checksums<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHECKSUM_CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          INPUT_TITLE: ${{ github.event.inputs.release_name }}
          TAG_NAME: ${{ steps.prepare_assets.outputs.tag_name }}
          CHECKSUMS: ${{ steps.prepare_assets.outputs.checksums }}
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag_name }}
          name: ${{ env.INPUT_TITLE != '' && env.INPUT_TITLE || format('انتشار نسخه جدید سامانه سماد ({0})', steps.prepare_assets.outputs.tag_name) }}
          body: |
            ## 📱 انتشار نسخه جدید سامانه سماد (${{ env.TAG_NAME }})

            ### ✨ تغییرات این نسخه (${{ env.TAG_NAME }}):
            - 🔋 **بهینه‌سازی مصرف باتری:** حذف دریافت‌های دقیقه‌ای ویجت و استفاده از زمان‌بندی بهینه RTC جهت کاهش چشمگیر مصرف باتری و پردازنده.
            - 🔢 **اصلاح چیدمان ارقام کد فراموشی در ویجت:** تضمین نمایش صحیح چپ‌به‌راست ارقام ۹ رقمی کد فراموشی در تمام لانچرها بدون معکوس شدن.
            - 💡 **روشنایی هوشمند صفحه:** فعال‌سازی حداکثر روشنایی صرفاً هنگام باز شدن پنجره بزرگنمایی بارکد و بازگشت خودکار به روشنایی عادی پس از بستن آن.
            - 🧹 **پاکسازی کامل بخش پیام‌رسان.**

            ### 🔒 اعتبارسنجی فایل‌ها و هش SHA-256:
            جهت اطمینان از سلامت و عدم تغییر فایل‌های نصبی، می‌توانید هش SHA-256 فایل دانلود شده را با مقادیر زیر بررسی نمایید:

            ```
            ${{ env.CHECKSUMS }}
            ```

            ### 📥 راهنمای فایل‌های نصبی:
            - **`arm64-v8a`:** مناسب برای اکثر گوشی‌های هوشمند جدید (نسخه سبک و سریع).
            - **`armeabi-v7a`:** مناسب برای دستگاه‌های قدیمی‌تر ۳۲ بیتی.
            - **`universal`:** نسخه کامل و سازگار با تمام دستگاه‌ها.
          files: |
            release_assets/*.apk
            release_assets/SHA256SUMS.txt
          draft: false
          prerelease: false
