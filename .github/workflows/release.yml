name: Build & Publish Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.3.0)'
        required: false
        default: ''
      release_name:
        description: 'Release Title'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
          elif [ -f "$GITHUB_WORKSPACE/my-upload-key.jks" ]; then
            echo "Using existing repository keystore (my-upload-key.jks)..."
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
          else
            echo "Generating new keystore (my-upload-key.jks)..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SamadFoodQR, OU=Mobile, O=Samad, L=Tehran, ST=Tehran, C=IR"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Android APK
        run: |
          ./gradlew assembleRelease --no-daemon -Dkotlin.compiler.execution.strategy=daemon || ./gradlew assembleDebug --no-daemon

      - name: Locate and Prepare Release APKs
        id: apk_locator
        run: |
          # 1. Determine Version from input, git tag, or app/build.gradle.kts
          GRADLE_VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$GRADLE_VERSION" ]; then
            GRADLE_VERSION="1.4.1"
          fi

          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="v${GRADLE_VERSION}"
            fi
          fi

          # Ensure tag starts with 'v'
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v${TAG}"
          fi

          mkdir -p release_apks
          APK_COUNT=0

          for apk in $(find app/build/outputs/apk -name "*.apk"); do
            apk_filename=$(basename "$apk")
            if [[ "$apk_filename" == *"arm64-v8a"* ]]; then
              dest_name="SamadFoodQR-${TAG}-arm64-v8a.apk"
            elif [[ "$apk_filename" == *"armeabi-v7a"* ]]; then
              dest_name="SamadFoodQR-${TAG}-armeabi-v7a.apk"
            elif [[ "$apk_filename" == *"universal"* ]]; then
              dest_name="SamadFoodQR-${TAG}-universal.apk"
            else
              dest_name="SamadFoodQR-${TAG}-${apk_filename}"
            fi
            cp "$apk" "release_apks/$dest_name"
            echo "Prepared: $apk -> release_apks/$dest_name"
            APK_COUNT=$((APK_COUNT + 1))
          done

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "Error: No APK files found!"
            exit 1
          fi

          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "gradle_version=$GRADLE_VERSION" >> $GITHUB_OUTPUT
          echo "Successfully prepared $APK_COUNT APK(s) in release_apks folder for tag $TAG"

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_locator.outputs.tag_name }}
          name: ${{ github.event.inputs.release_name || format('انتشار نسخه جدید سامانه سماد ({0})', steps.apk_locator.outputs.tag_name) }}
          body: |
            ## 📱 انتشار نسخه جدید سامانه سماد (${{ steps.apk_locator.outputs.tag_name }})
            
            ### ✨ تغییرات این نسخه:
            - ⚡ **تولید دقیق کیوآر کد منطبق بر استاندارد سلف سماد:** حالت بایت (Byte Mode)، سطح تصحیح خطای بالا (ECC H)، نسخه ۲ و پس‌زمینه سفید خالص جهت اسکن فوق‌سریع در گیت.
            - 🔍 **بزرگ‌نمایی تمام‌صفحه بارکد و QR:** امکان باز کردن کارت بارکد در سایز بزرگ با روشنایی متمرکز برای سلف دانشگاه.
            - 📐 **بهینه‌سازی ابعاد کارت‌ها:** سایزبندی ارگونومیک و فشرده متناسب با انواع صفحه‌نمایش‌های گوشی بدون اسکرول مزاحم.
            - 🔙 **اصلاح کامل ناوبری پیام‌رسان:** دکمه بازگشت مستقیم به میزکار و پشتیبانی از دکمه فیزیکی گوشی (`BackHandler`).
            - ⚙️ **خروجی چندمعماری (Multi-Architecture):** نسخه‌های مجزا و سبک برای پردازنده‌های `arm64-v8a` (گوشی‌های جدید)، `armeabi-v7a` (گوشی‌های قدیمی) و نسخه یکپارچه یونیورسال.
            
            ### 📥 راهنمای دانلود و نصب:
            - **`arm64-v8a`:** مناسب برای ۹۵٪ گوشی‌های هوشمند جدید (نسخه سبک و بهینه).
            - **`armeabi-v7a`:** مناسب برای گوشی‌های قدیمی‌تر ۳۲ بیتی.
            - **`universal`:** نسخه جامع سازگار با تمامی مدل‌ها.
          files: release_apks/*.apk
          draft: false
          prerelease: false
